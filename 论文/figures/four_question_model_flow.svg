<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">光储微网四问统一建模与求解流程</title>
  <desc id="desc">从多源数据预处理到问题一至问题四，再到统一验证和论文成果输出的总流程图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FAFF"/><stop offset="1" stop-color="#EEF4FB"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#123B63"/><stop offset="1" stop-color="#176B87"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#16324F" flood-opacity=".13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#54718A"/></marker>
    <style>
      .sans{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif} .title{font-size:34px;font-weight:700;fill:#fff;letter-spacing:2px}
      .sub{font-size:16px;fill:#D7E9F2} .section{font-size:20px;font-weight:700;fill:#123B63} .qtitle{font-size:22px;font-weight:700;fill:#fff}
      .body{font-size:17px;fill:#24445C} .small{font-size:15px;fill:#587187} .tag{font-size:14px;font-weight:700;fill:#176B87}
    </style>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <rect x="35" y="28" width="1530" height="102" rx="22" fill="url(#head)" filter="url(#shadow)"/>
  <text x="800" y="74" text-anchor="middle" class="sans title">多源异步信息约束下光储微网的因果预测与滚动优化调度</text>
  <text x="800" y="105" text-anchor="middle" class="sans sub">四问递进建模总流程 · 预测—决策—回放—结算闭环</text>

  <text x="70" y="177" class="sans section">统一数据底座与建模口径</text>
  <rect x="60" y="198" width="1480" height="132" rx="18" fill="#fff" stroke="#C8D8E5" stroke-width="2" filter="url(#shadow)"/>
  <g class="sans">
    <rect x="86" y="223" width="280" height="82" rx="12" fill="#E5F2F5"/><text x="226" y="252" text-anchor="middle" class="tag">多源数据</text><text x="226" y="280" text-anchor="middle" class="body">负荷 · 光伏 · 电价 · 预测</text>
    <rect x="408" y="223" width="280" height="82" rx="12" fill="#EAF0FA"/><text x="548" y="252" text-anchor="middle" class="tag">时间语义</text><text x="548" y="280" text-anchor="middle" class="body">10 min · 左端点 · 跨日 slot144</text>
    <rect x="730" y="223" width="280" height="82" rx="12" fill="#FFF3D9"/><text x="870" y="252" text-anchor="middle" class="tag">信息边界</text><text x="870" y="280" text-anchor="middle" class="body">只用决策时刻已知信息</text>
    <rect x="1052" y="223" width="420" height="82" rx="12" fill="#F3EAF8"/><text x="1262" y="252" text-anchor="middle" class="tag">统一物理接口</text><text x="1262" y="280" text-anchor="middle" class="body">能量平衡 · SOC · 充放电互斥 · 不售电</text>
  </g>
  <path d="M800 330 L800 365" stroke="#54718A" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="70" y="405" class="sans section">四问递进模型链</text>
  <g class="sans" filter="url(#shadow)">
    <rect x="60" y="430" width="350" height="300" rx="18" fill="#176B87"/>
    <text x="88" y="474" class="qtitle">问题一 · 确定性基准</text><line x1="88" y1="493" x2="382" y2="493" stroke="#80C4D1"/>
    <text x="88" y="535" class="body" fill="#fff">单日负荷、光伏与电价已知</text><text x="88" y="570" class="body" fill="#fff">储能调度 MILP</text><text x="88" y="605" class="body" fill="#fff">首末 SOC 约束</text><text x="88" y="665" class="small" fill="#D7E9F2">输出：计划购电、充放电、日费用</text>
    <rect x="450" y="430" width="350" height="300" rx="18" fill="#397A9C"/>
    <text x="478" y="474" class="qtitle">问题二 · 日前因果调度</text><line x1="478" y1="493" x2="772" y2="493" stroke="#9BD2DE"/>
    <text x="478" y="535" class="body" fill="#fff">历史同刻预测负荷与光伏</text><text x="478" y="570" class="body" fill="#fff">净负荷残差风险缓冲</text><text x="478" y="605" class="body" fill="#fff">逐日 MILP 与真实回放</text><text x="478" y="665" class="small" fill="#D7E9F2">输出：紧急购电与全年费用</text>
    <rect x="840" y="430" width="350" height="300" rx="18" fill="#5C8D9A"/>
    <text x="868" y="474" class="qtitle">问题三 · 日内滚动调整</text><line x1="868" y1="493" x2="1162" y2="493" stroke="#B5DFDF"/>
    <text x="868" y="535" class="body" fill="#fff">0/6/12/18 时更新 PV 预测</text><text x="868" y="570" class="body" fill="#fff">滚动时域重优化购电计划</text><text x="868" y="605" class="body" fill="#fff">调整成本与实际结算</text><text x="868" y="665" class="small" fill="#E2F3F0">输出：滚动调整收益与稳定性</text>
    <rect x="1230" y="430" width="310" height="300" rx="18" fill="#805C8F"/>
    <text x="1258" y="474" class="qtitle">问题四 · 价格感知</text><line x1="1258" y1="493" x2="1512" y2="493" stroke="#D7BFE0"/>
    <text x="1258" y="535" class="body" fill="#fff">因果波动电价预测</text><text x="1258" y="570" class="body" fill="#fff">价格感知储能 MILP</text><text x="1258" y="605" class="body" fill="#fff">光伏—价格联合滚动</text><text x="1258" y="665" class="small" fill="#F0E5F4">输出：价格价值与综合费用</text>
  </g>
  <g stroke="#54718A" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M410 580 H442"/><path d="M800 580 H832"/><path d="M1190 580 H1222"/></g>
  <g class="sans"><text x="425" y="558" text-anchor="middle" class="small">确定性 → 不确定性</text><text x="815" y="558" text-anchor="middle" class="small">日前 → 日内</text><text x="1205" y="558" text-anchor="middle" class="small">固定价 → 波动价</text></g>

  <path d="M800 730 L800 765" stroke="#54718A" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="70" y="805" class="sans section">统一验证与成果输出</text>
  <g class="sans" filter="url(#shadow)">
    <rect x="60" y="830" width="460" height="100" rx="16" fill="#fff" stroke="#C8D8E5" stroke-width="2"/><text x="290" y="864" text-anchor="middle" class="tag">Validation</text><text x="290" y="895" text-anchor="middle" class="body">因果性 · 能量平衡 · SOC 连续 · Excel 回读</text>
    <rect x="570" y="830" width="460" height="100" rx="16" fill="#fff" stroke="#C8D8E5" stroke-width="2"/><text x="800" y="864" text-anchor="middle" class="tag">Performance</text><text x="800" y="895" text-anchor="middle" class="body">费用 · 预测精度 · 紧急购电 · 鲁棒性</text>
    <rect x="1080" y="830" width="460" height="100" rx="16" fill="#fff" stroke="#C8D8E5" stroke-width="2"/><text x="1310" y="864" text-anchor="middle" class="tag">Deliverables</text><text x="1310" y="895" text-anchor="middle" class="body">结果表格 · 运行证据 · 论文结论</text>
  </g>
</svg>
